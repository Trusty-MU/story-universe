  <style>
    /* Splash: inline so it paints before anything else loads. */
    #splash { position: fixed; inset: 0; z-index: 100; background: #fbf3e4; color: #4a3323; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; transition: opacity .45s cubic-bezier(.2,.8,.2,1), transform .45s cubic-bezier(.2,.8,.2,1); }
    #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #splash .sp-fire { position: relative; width: 168px; height: 168px; border-radius: 50%; background: #fde3d6; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; animation: sp-pop .5s cubic-bezier(.2,.8,.2,1) both; }
    #splash .sp-fire::before { content: ""; position: absolute; width: 112px; height: 112px; border-radius: 50%; background: #fff0c2; bottom: -30px; left: 28px; }
    #splash .sp-flame { position: relative; margin-bottom: 22px; transform-origin: 50% 100%; animation: sp-ignite .9s .25s cubic-bezier(.2,.8,.2,1) both, sp-flick 2.4s 1.15s cubic-bezier(.2,.8,.2,1) infinite; }
    #splash .sp-spark { position: absolute; bottom: 70px; width: 8px; height: 8px; border-radius: 50%; background: #ffb703; opacity: 0; animation: sp-rise 1.8s 1s ease-out infinite; }
    #splash .sp-spark.s2 { left: 62px; animation-delay: 1.5s; background: #f0632b; width: 6px; height: 6px; }
    #splash .sp-spark.s3 { left: 104px; animation-delay: 2.1s; }
    #splash .sp-spark.s1 { left: 84px; }
    #splash h1 { margin: 0; font-family: "Fredoka", system-ui, sans-serif; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.02em; animation: sp-up .6s .7s cubic-bezier(.2,.8,.2,1) both; }
    #splash p { margin: 0; font-family: "Figtree", system-ui, sans-serif; font-size: 17px; font-weight: 600; color: #6b5443; animation: sp-up .6s .95s cubic-bezier(.2,.8,.2,1) both; }
    #splash .sp-dots { display: flex; gap: 8px; animation: sp-up .6s 1.1s cubic-bezier(.2,.8,.2,1) both; }
    #splash .sp-dots i { width: 9px; height: 9px; border-radius: 50%; background: #f0632b; animation: sp-dot 1.2s infinite; }
    #splash .sp-dots i:nth-child(2) { animation-delay: .15s; } #splash .sp-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes sp-pop { from { transform: scale(.6); opacity: 0; } }
    @keyframes sp-ignite { 0% { transform: rotate(-8deg) scale(0, .2); } 60% { transform: rotate(-8deg) scale(1.08, 1.12); } 100% { transform: rotate(-8deg) scale(1); } }
    @keyframes sp-flick { 0%, 100% { transform: rotate(-8deg) scaleY(1); } 50% { transform: rotate(-5deg) scaleY(1.06); } }
    @keyframes sp-rise { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-80px) translateX(6px); } }
    @keyframes sp-up { from { opacity: 0; transform: translateY(12px); } }
    @keyframes sp-dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash, #splash * { animation: none !important; transition: none !important; } }
  </style>
