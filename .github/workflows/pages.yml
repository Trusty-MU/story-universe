name: Deploy app to GitHub Pages

on:
  push:
    branches: [main, claude/amazing-pasteur-ygq8pp]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled once in repo settings (Source: GitHub Actions).
      - uses: actions/configure-pages@v5
      # Stamp asset URLs with this commit so phones always fetch the new files.
      - name: Version asset URLs
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" web/*.html web/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
